name: Test and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Assemble public site
        run: |
          mkdir -p _site/lib _site/data
          cp index.html style.css app.mjs _site/
          cp lib/prices.mjs lib/receipts.mjs lib/dishes.mjs lib/fees.mjs lib/foodora.mjs _site/lib/
          cp data/history.json _site/data/
          if [ -f data/receipts.json ]; then cp data/receipts.json _site/data/; fi
          if [ -f data/images.json ]; then cp data/images.json _site/data/; fi
          if [ -f data/fees.json ]; then cp data/fees.json _site/data/; fi
          if [ -f data/foodora.json ]; then cp data/foodora.json _site/data/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
