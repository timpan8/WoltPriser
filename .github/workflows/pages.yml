name: Test and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Assemble public site
        run: |
          mkdir -p _site/lib _site/data
          cp index.html style.css app.mjs _site/
          cp lib/prices.mjs lib/receipts.mjs lib/dishes.mjs lib/fees.mjs lib/foodora.mjs lib/subcats.mjs _site/lib/
          node scripts/build-data.mjs _site/data
          if [ -f data/receipts.json ]; then cp data/receipts.json _site/data/; fi
          if [ -f data/images.json ]; then cp data/images.json _site/data/; fi
          if [ -f data/fees.json ]; then cp data/fees.json _site/data/; fi
          cp data/venues.json _site/data/
          if [ -f data/discovered.json ]; then cp data/discovered.json _site/data/; fi
          # Restauranger utanför Wolt i egna filer som sidan hämtar bara när de visas.
          node scripts/split-compare.mjs _site/data foodora ubereats
          if [ -f data/ratings.json ]; then cp data/ratings.json _site/data/; fi
          if [ -f data/google.json ]; then cp data/google.json _site/data/; fi
          if [ -f data/venueinfo.json ]; then cp data/venueinfo.json _site/data/; fi
          # Versionera skript och stil per commit, så att webbläsaren aldrig blandar gamla och nya filer ur cachen.
          v="${GITHUB_SHA::12}"
          sed -i "s#href=\"style.css\"#href=\"style.css?v=$v\"#; s#src=\"app.mjs\"#src=\"app.mjs?v=$v\"#" _site/index.html
          sed -i "s#from '\./lib/\([a-z]*\)\.mjs'#from './lib/\1.mjs?v=$v'#g" _site/app.mjs
          grep -q "app.mjs?v=$v" _site/index.html && ! grep -q "from './lib/[a-z]*\.mjs'" _site/app.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
